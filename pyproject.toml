[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "market-traits"
version = "0.1.0"
description = "Market weather, global-markets rotation, and industry rotation regime reads — free daily data, fully injectable."
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0.0",
    "yfinance>=0.2.36",
]

[project.optional-dependencies]
test = ["pytest>=8.0.0", "numpy>=1.26.0"]

[tool.setuptools.packages.find]
include = ["market_traits*"]
